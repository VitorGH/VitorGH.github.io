<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitor Barroso Rodrigues | Links</title>
    <meta name="description" content="Portfólio e links profissionais de Vitor Barroso Rodrigues — Desenvolvedor de Software.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Canvas interativo com partículas (JavaScript) -->
    <canvas id="particle-canvas" aria-hidden="true"></canvas>

    <div class="container">
        <div class="card">
            <div class="profile" data-reveal>
                <div class="photo-wrapper">
                    <img class="photo" src="./images/profile-photo.jpg"
                        alt="Foto de Vitor Barroso Rodrigues">
                </div>
                <p class="greeting"></p>
                <h1 class="name">Vitor Barroso Rodrigues</h1>
                <p class="headline" aria-label="Desenvolvedor de Software">Desenvolvedor de Software</p>
                <p class="bio">Apaixonado por tecnologia, desenvolvimento e aprendizado contínuo. Confira meus projetos e certificações abaixo.</p>
            </div>

            <nav class="links" aria-label="Links profissionais">
                <a href="https://github.com/VitorGH" class="link-item" target="_blank" rel="noopener noreferrer"
                    data-reveal data-reveal-delay="100">
                    <i class="fa-brands fa-github"></i>
                    <div class="link-text">
                        <span class="link-title">GitHub</span>
                        <span class="link-desc">Meus projetos e repositórios</span>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square link-arrow"></i>
                </a>

                <a href="https://www.credly.com/users/vitor-barroso-rodrigues" class="link-item" target="_blank"
                    rel="noopener noreferrer" data-reveal data-reveal-delay="200">
                    <i class="fa-solid fa-award"></i>
                    <div class="link-text">
                        <span class="link-title">Credly</span>
                        <span class="link-desc">Certificações e badges</span>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square link-arrow"></i>
                </a>

                <a href="https://www.linkedin.com/in/vitor-barroso-rodrigues-424822257/" class="link-item"
                    target="_blank" rel="noopener noreferrer" data-reveal data-reveal-delay="300">
                    <i class="fa-brands fa-linkedin"></i>
                    <div class="link-text">
                        <span class="link-title">LinkedIn</span>
                        <span class="link-desc">Perfil profissional</span>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square link-arrow"></i>
                </a>
            </nav>

            <footer class="footer" data-reveal data-reveal-delay="400">
                <p>&copy; 2026 Vitor Barroso Rodrigues</p>
            </footer>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
